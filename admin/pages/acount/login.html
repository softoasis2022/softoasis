<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SoftOasis 관리자 로그인</title>

    <link
        rel="stylesheet"
        href="/acount/css/login.css"
    >
</head>

<body>
    <main class="login_page">
        <section class="login_card">
            <header class="login_header">
                <div class="logo">
                    <span class="logo_mark">S</span>

                    <div>
                        <p class="company_name">SoftOasis</p>
                        <p class="admin_label">Admin</p>
                    </div>
                </div>

                <h1>관리자 로그인</h1>

                <p class="login_description">
                    관리자 계정으로 로그인해주세요.
                </p>
            </header>

            <form
                id="adminLoginForm"
                action="/acount/login"
                method="post"
                novalidate
            >
                <div class="form_group">
                    <label for="adminId">
                        관리자 아이디
                    </label>

                    <input
                        type="text"
                        id="adminId"
                        name="adminId"
                        placeholder="관리자 아이디 입력"
                        autocomplete="username"
                        minlength="4"
                        maxlength="30"
                        required
                    >
                </div>

                <div class="form_group">
                    <label for="password">
                        비밀번호
                    </label>

                    <div class="password_field">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="비밀번호 입력"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="passwordToggle"
                            class="password_toggle"
                            aria-label="비밀번호 표시"
                        >
                            보기
                        </button>
                    </div>
                </div>

                <p
                    id="loginMessage"
                    class="login_message"
                    role="alert"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    id="loginButton"
                    class="login_button"
                >
                    로그인
                </button>
            </form>

            <footer class="login_footer">
                <p>
                    허가된 관리자만 접근할 수 있습니다.
                </p>
            </footer>
        </section>
    </main>

    <script src="/acount/js/login.js"></script>
</body>
</html>
