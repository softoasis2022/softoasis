<main>
    <link
        rel="stylesheet"
        href="/calender/css/main.css"
    >

    <script
        src="/calender/js/main.js"
        defer
    ></script>

    <!-- 캘린더 -->
    <section class="calendar_section">
        <div class="container">
            <div class="header">
                <button
                    type="button"
                    class="date-last"
                    id="btn"
                    aria-label="이전 달"
                >
                    &lt;
                </button>

                <h2 class="date-now"></h2>

                <button
                    type="button"
                    class="date-next"
                    id="btn"
                    aria-label="다음 달"
                >
                    &gt;
                </button>
            </div>

            <div class="main">
                <div class="calendar">
                    <div class="grid date-title">
                        <div class="sunday">일</div>
                        <div>월</div>
                        <div>화</div>
                        <div>수</div>
                        <div>목</div>
                        <div>금</div>
                        <div class="saturday">토</div>
                    </div>

                    <!-- JavaScript에서 날짜가 들어가는 영역 -->
                    <div class="grid date-board"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- 일정 목록 -->
    <section class="schedule_list">
        <header class="schedule_list_header">
            <div class="schedule_title_area">
                <p class="schedule_label">Schedule</p>
                <h2>일정 목록</h2>

                <p class="schedule_description">
                    선택한 날짜에 등록된 일정을 확인할 수 있습니다.
                </p>
            </div>

            <a
                href="/calender/schedule/create"
                class="schedule_create_button"
            >
                일정 등록
            </a>
        </header>

        <!-- 선택 날짜와 일정 개수 -->
        <div class="schedule_summary">
            <div>
                <span class="summary_label">
                    선택 날짜
                </span>

                <time
                    id="scheduleSelectedDate"
                    class="selected_date"
                    datetime=""
                >
                    날짜를 선택해주세요.
                </time>
            </div>

            <p class="schedule_count">
                총
                <strong id="scheduleCount">0</strong>
                개의 일정
            </p>
        </div>

        <!-- 일정 목록 -->
        <ul
            class="schedule_items"
            id="scheduleList"
        >
            <!-- 일정 예시 -->
            <li class="schedule_item">
                <a
                    href="/calender/schedule/detail"
                    class="schedule_item_link"
                >
                    <div class="schedule_date_box">
                        <span class="schedule_month">
                            09월
                        </span>

                        <strong class="schedule_day">
                            15
                        </strong>
                    </div>

                    <div class="schedule_information">
                        <div class="schedule_item_header">
                            <span class="schedule_category">
                                개인 일정
                            </span>

                            <time class="schedule_time">
                                하루 종일
                            </time>
                        </div>

                        <h3 class="schedule_item_title">
                            등록된 일정 제목
                        </h3>

                        <p class="schedule_item_description">
                            등록된 일정에 대한 설명이 표시됩니다.
                        </p>

                        <div class="schedule_period">
                            <span>시작일: 2026-09-15</span>
                            <span>종료일: 2026-09-15</span>
                        </div>
                    </div>

                    <span
                        class="schedule_arrow"
                        aria-hidden="true"
                    >
                        &gt;
                    </span>
                </a>
            </li>
        </ul>

        <!-- 일정이 없을 때 표시 -->
        <div
            class="schedule_empty"
            id="scheduleEmpty"
            hidden
        >
            <p class="empty_icon" aria-hidden="true">
                📅
            </p>

            <h3>등록된 일정이 없습니다.</h3>

            <p>
                해당 날짜에 새로운 일정을 등록해보세요.
            </p>

            <a href="/calender/schedule/create">
                일정 등록하기
            </a>
 </a>
        </div>
    </section>
    <section>
        
    </section>
</main>
